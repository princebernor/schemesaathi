# Render Blueprint: SchemeSaathi API (Node) + PostgreSQL.
# Create with: Render dashboard → New → Blueprint → select this repository.
# The only value you type yourself is GEMINI_API_KEY (marked sync: false, so it is never stored in Git).
services:
  - type: web
    name: schemesaathi-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: schemesaathi-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: schemesaathi-db
    plan: free
    region: singapore
    databaseName: schemesaathi
    user: schemesaathi_app
